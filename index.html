<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1e3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CashFlow" />
    <!--
      Earliest height lock for iOS Add-to-Home-Screen.
      Standalone: use innerHeight and NEVER offset bottom by visualViewport
      (that offset was recreating the phantom gap under the tab bar).
    -->
    <script>
      (function () {
        var standalone =
          navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        if (standalone) document.documentElement.classList.add('is-standalone')
        var vv = window.visualViewport
        var height = standalone
          ? Math.max(window.innerHeight || 0, (vv && vv.height) || 0)
          : (vv ? vv.height : window.innerHeight)
        var root = document.documentElement
        root.style.setProperty('--app-height', Math.round(height) + 'px')
        root.style.setProperty('--vv-bottom', '0px')
        root.style.setProperty('--vv-top', '0px')
      })()
    </script>
    <link rel="apple-touch-icon" href="/icon-192.png" sizes="192x192" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <title>CashFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
